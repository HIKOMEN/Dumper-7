name: Build DLL
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Dumper/Dumper.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      - uses: actions/upload-artifact@v4
        with:
          name: Dumper-7-dll
          path: '**/Dumper-7.dll'
